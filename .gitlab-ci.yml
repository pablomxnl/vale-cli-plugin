stages:
  - dockerbuild
  - build
  - deploy
  - release

variables:
  GRADLE_OPTS: "-Dorg.gradle.internal.launcher.welcomeMessageEnabled=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  PRODUCT: Writerside/pd
  ARTIFACT: webHelpPD2-all.zip
  WRS_VERSION: "2025.03.8312"

image: registry.gitlab.com/pablomxnl/vale-cli-plugin/builder:latest
default:
  tags:
    - saas-linux-medium-amd64

.build_release:
  stage: build
  coverage: '/    - Instruction Coverage: ([0-9.]+)%/'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  artifacts:
    when: always
    paths:
      - build/distributions/*.zip
      - build/docs
      - build/reports/tests
      - build/reports/jacoco/test
    reports:
      junit: build/test-results/test/**/TEST-*.xml
    expire_in: 360 days

.build_artifact:
  stage: build
  coverage: '/    - Instruction Coverage: ([0-9.]+)%/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    when: always
    paths:
      - build/distributions/*.zip
      - build/docs
      - build/reports/tests
      - build/reports/jacoco/test
    reports:
      junit: build/test-results/test/**/TEST-*.xml
    expire_in: 7 days

.trigger_teamcity:
  image: registry.hub.docker.com/badouralix/curl-jq:latest
  variables:
    TEAMCITY_BUILD_CONFIG_ID: ""
  script:
    - |-
      curl --silent --fail --output /dev/null --request POST \
        --header "Authorization: Bearer $TEAMCITY_TOKEN" \
        --header "Content-Type: application/json" \
        --header "Accept: application/json" \
        --data "{
          \"buildType\": { \"id\": \"$TEAMCITY_BUILD_CONFIG_ID\" },
          \"branchName\": \"$CI_COMMIT_REF_NAME\",
          \"comment\": { \"text\": \"Deploying from GitLab pipeline $CI_PIPELINE_ID, job $CI_JOB_ID\" }
        }" \
        "$TEAMCITY_URL/app/rest/buildQueue"

build_artifact:
  extends: .build_artifact
  script:
    - gradle -Dversion.prerelease=$CI_PIPELINE_ID-SNAPSHOT build
    - gradle buildPlugin
  after_script:
    - gradle printCoverageForGitlab

publish_eap:
  stage: deploy
  variables:
    PUSH_EAP: true
  script:
    - gradle -Dversion.prerelease=$CI_PIPELINE_ID-SNAPSHOT publishPlugin
  needs:
    - job: build_artifact
      artifacts: true
  rules:
    - if: '$CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_ID == "38399489"'
      when: manual
      allow_failure: true


build_release_artifact:
  extends: .build_release
  script:
    - gradle build
    - gradle buildPlugin
  after_script:
    - gradle printCoverageForGitlab

build-documentation:
  image: "registry.jetbrains.team/p/writerside/builder/writerside-builder:$WRS_VERSION"
  stage: build
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Writerside/
        - changelog.adoc
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Writerside/
        - changelog.adoc
  script:
    - set -e
    - export DISPLAY=:99
    - Xvfb :99 &
    - /opt/builder/bin/idea.sh helpbuilderinspect -source-dir . -product $PRODUCT --runner gitlab -output-dir public/
    - echo "Test existing of $ARTIFACT artifact"
    - test -e public/$ARTIFACT
  artifacts:
    paths:
      - public/$ARTIFACT

pages:
  stage: deploy
  image: registry.gitlab.com/pablomxnl/vale-cli-plugin/releaser:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Writerside/
        - changelog.adoc
  script:
    - cp -R build/reports/jacoco/test public/
    - mv public/test public/coverage
    - cp -R build/reports/tests/test public/
    - mv public/test public/testreport
    - cd public
    - unzip $ARTIFACT
  artifacts:
    paths:
      - public

publish_docs_staging_marketplace:
  extends: .trigger_teamcity
  stage: deploy
  needs:
    - pages
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Writerside/
        - changelog.adoc
  variables:
    TEAMCITY_BUILD_CONFIG_ID: $TEAMCITY_STAGING_BUILD_CONFIG_ID

prepare_release_notes:
  stage: build
  image: registry.gitlab.com/pablomxnl/vale-cli-plugin/releaser:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  script:
    - downdoc changelog.adoc
    - awk '/^### /{if(x)exit;x=1}x' changelog.md > release_notes.md
  artifacts:
    paths:
      - release_notes.md

release_job:
  stage: release
  image: registry.gitlab.com/pablomxnl/vale-cli-plugin/releaser:latest
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: 'true'
  needs:
    - job: prepare_release_notes
      artifacts: true
    - job: build_release_artifact
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  script:
    - |
      glab release create "$CI_COMMIT_TAG" \
        --name "Release $CI_COMMIT_TAG" \
        --ref "$CI_COMMIT_SHA" \
        --notes-file release_notes.md \
        --assets-links="[{\"name\": \"Vale CLI Plugin v$CI_COMMIT_TAG for Jetbrain's IDEs\", \"url\": \"$CI_SERVER_URL/$CI_PROJECT_PATH/-/jobs/$CI_JOB_ID/artifacts/file/build/distributions/vale-cli-plugin-$CI_COMMIT_TAG.zip\", \"link_type\": \"other\"}]"
  artifacts:
    when: always
    paths:
      - build/distributions/*.zip

upload_marketplace:
  stage: release
  rules:
    - if: '$CI_PROJECT_ID != "38399489"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  needs:
    - job: build_release_artifact
      artifacts: true
    - job: release_job
      artifacts: false
  script:
    - gradle publishPlugin

publish_docs_marketplace:
  extends: .trigger_teamcity
  stage: release
  needs:
    - job: upload_marketplace
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
      when: manual
  variables:
    TEAMCITY_BUILD_CONFIG_ID: $TEAMCITY_PRODUCTION_BUILD_CONFIG_ID

.build_docker_image:
  stage: dockerbuild
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > ~/.docker/config.json
  script:
    - buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$DOCKERFILE_DIR"
      --output type=image,\"name=$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_VERSION,$CI_REGISTRY_IMAGE/$IMAGE_NAME:latest\",push=true

get_project_version:
  stage: dockerbuild
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/builder/Dockerfile
        - docker/releaser/Dockerfile
        - mise.toml
  script:
    - echo "BUILDER_VERSION=$(gradle properties | grep '^version:' | awk '{printf $2}')" >> build.env
  artifacts:
    reports:
      dotenv: build.env

build_builder_image:
  extends: .build_docker_image
  needs:
    - job: get_project_version
      artifacts: true
  variables:
    DOCKERFILE_DIR: "$CI_PROJECT_DIR/docker/builder"
    IMAGE_NAME: builder
    IMAGE_VERSION: $BUILDER_VERSION
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/builder/Dockerfile
        - mise.toml

build_release_builder_image:
  extends: .build_docker_image
  needs:
    - job: get_project_version
      artifacts: true
  variables:
    DOCKERFILE_DIR: "$CI_PROJECT_DIR/docker/releaser"
    IMAGE_NAME: releaser
    IMAGE_VERSION: $BUILDER_VERSION
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/releaser/Dockerfile
        - mise.toml