# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html
pluginGroup = org.ideplugins.vale-plugin
pluginName = Vale CLI

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 252.23892.409

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.intellij.java, com.jetbrains.php:203.4449.22
platformBundledPlugins = com.intellij.java
platformPlugins=org.asciidoctor.intellij.asciidoc:0.43.6,PythonCore:243.22562.145

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.1.0

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
#org.gradle.logging.level=quiet

# Enable Gradle Kotlin DSL Lazy Property Assignment -> https://docs.gradle.org/current/userguide/kotlin_dsl.html#kotdsl:assignment
systemProp.org.gradle.unsafe.kotlin.assignment = true

kotlin.stdlib.default.dependency = false

org.gradle.jvmargs=-Xmx2560m
pluginVerifierIdeVersions = IU-2025.3.6,IU-2026.1.4,IU-262.9437.22

# Workaround for https://github.com/JetBrains/intellij-platform-gradle-plugin/issues/2183
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=\
  com.intellij.openRewrite,\
  com.intellij.ja,\
  com.intellij.ko,com.intellij.zh,\
  org.jetbrains.plugins.vue